<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.webmanifest">
    <title>Keranjang - MARKET XYZ</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar glass">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">🛒</span>
                <span class="brand-text">MARKET XYZ</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link" data-page="home">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>Home</span>
                </a>
                <a href="upload.html" class="nav-link" data-page="upload">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Upload</span>
                </a>
                <a href="cart.html" class="nav-link active" data-page="cart">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6.5-8h5.5l-2.2 4.5H9.6L6.5 4H3v2h2l3.6 7.6L7.2 17h11.2v-2H8.8l.7-1.4z"/></svg>
                    <span>Cart</span>
                </a>
                <a href="profile.html" class="nav-link" data-page="profile">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>Profile</span>
                </a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm2.83 2.83c.74.74 1.17 1.76 1.17 2.83s-.43 2.09-1.17 2.83S14 14.9 12 14.9s-2.09-.43-2.83-1.17S8 12.1 8 12s.43-2.09 1.17-2.83S10.1 9.1 12 9.1s2.09.43 2.83 1.17z"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M9.5 4c-1.93 0-3.7.78-4.98 2.03C6.56 6.05 8 7.22 8 8.5c0 2.21-1.79 4-4 4-.78 0-1.52-.23-2.15-.63C2.31 14.47 4.66 17 7.5 17 11.09 17 14 14.09 14 10.5c0-2.66-1.73-4.92-4.08-5.78.04-.24.08-.48.08-.72z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <main class="main-content">
        <div class="container">
            <div class="cart-container">
                <h1 class="page-title">Keranjang Belanja</h1>
                <div id="cartItems" class="cart-items">
                    <!-- Cart items will be rendered here -->
                </div>
                <div class="cart-summary glass">
                    <div class="summary-row">
                        <span>Total Produk:</span>
                        <span id="totalItems">0</span>
                    </div>
                    <div class="summary-row">
                        <span>Total Harga:</span>
                        <span id="totalPrice">Rp 0</span>
                    </div>
                    <button id="checkoutBtn" class="btn-primary btn-large">Checkout</button>
                </div>
            </div>
        </div>
    </main>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
