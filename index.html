<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png">
    <title>MARKET XYZ - Marketplace Modern</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen">
        <div class="loader"></div>
        <p>Loading MARKET XYZ...</p>
    </div>

    <!-- Navbar -->
    <nav class="navbar glass">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="brand-icon">🛒</span>
                <span class="brand-text">MARKET XYZ</span>
            </div>
            <div class="nav-menu" id="nav-menu">
                <a href="index.html" class="nav-link active" data-page="home">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    <span>Home</span>
                </a>
                <a href="upload.html" class="nav-link" data-page="upload">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    <span>Upload</span>
                </a>
                <a href="cart.html" class="nav-link" data-page="cart">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm10 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6.5-8h5.5l-2.2 4.5H9.6L6.5 4H3v2h2l3.6 7.6L7.2 17h11.2v-2H8.8l.7-1.4z"/></svg>
                    <span>Cart</span>
                </a>
                <a href="profile.html" class="nav-link" data-page="profile">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    <span>Profile</span>
                </a>
            </div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zm2.83 2.83c.74.74 1.17 1.76 1.17 2.83s-.43 2.09-1.17 2.83S14 14.9 12 14.9s-2.09-.43-2.83-1.17S8 12.1 8 12s.43-2.09 1.17-2.83S10.1 9.1 12 9.1s2.09.43 2.83 1.17z"/></svg>
                    <svg class="moon-icon" viewBox="0 0 24 24"><path d="M9.5 4c-1.93 0-3.7.78-4.98 2.03C6.56 6.05 8 7.22 8 8.5c0 2.21-1.79 4-4 4-.78 0-1.52-.23-2.15-.63C2.31 14.47 4.66 17 7.5 17 11.09 17 14 14.09 14 10.5c0-2.66-1.73-4.92-4.08-5.78.04-.24.08-.48.08-.72z"/></svg>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <div class="container">
            <!-- Search Bar -->
            <div class="search-section glass">
                <div class="search-container">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" placeholder="Cari produk..." class="search-input">
                </div>
                <div class="filter-container">
                    <select id="categoryFilter" class="filter-select">
                        <option value="all">Semua Kategori</option>
                        <option value="elektronik">Elektronik</option>
                        <option value="fashion">Fashion</option>
                        <option value="rumah">Rumah & Dapur</option>
                        <option value="olahraga">Olahraga</option>
                        <option value="buku">Buku</option>
                        <option value="lainnya">Lainnya</option>
                    </select>
                </div>
            </div>

            <!-- Banner -->
            <div class="banner glass">
                <div class="banner-content">
                    <h1>Selamat Datang di MARKET XYZ</h1>
                    <p>Temukan dan jual berbagai produk berkualitas</p>
                    <a href="upload.html" class="btn-primary">Jual Sekarang</a>
                </div>
                <div class="banner-image">
                    <svg viewBox="0 0 200 200"><circle cx="100" cy="100" r="80" fill="rgba(255,255,255,0.1)"/><path d="M60 80 L80 60 L120 60 L140 80 L140 120 L120 140 L80 140 L60 120 Z" fill="rgba(255,255,255,0.2)"/><circle cx="100" cy="100" r="30" fill="rgba(255,255,255,0.3)"/></svg>
                </div>
            </div>

            <!-- Products Grid -->
            <section class="products-section">
                <div class="section-header">
                    <h2>Produk Terbaru</h2>
                    <span class="product-count" id="productCount">0 produk</span>
                </div>
                <div class="products-grid" id="productsGrid">
                    <!-- Products will be rendered here -->
                </div>
            </section>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>

    <script src="script.js"></script>
</body>
</html>
